name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Check rule packs
        run: uv run trident validate

      - name: Run tests (offline, fake LLM)
        run: uv run pytest

  latest-deps:
    # Install the newest allowed versions (ignore uv.lock), the way a business
    # adds trident to its own project. Catches breaking upstream releases early.
    name: Tests (newest dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"

      - name: Install the newest allowed dependencies
        run: uv sync --upgrade

      - name: Run tests (offline, fake LLM)
        run: uv run pytest
