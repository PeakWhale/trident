[project]
name = "trident"
version = "0.2.0"
description = "PEAKWHALE™ TRIDENT - fail-safe AI plus rules triage engine with editable rule packs"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "anyio>=4.5",
    "fastapi>=0.128.0",
    "httpx>=0.28.1",
    "langgraph>=1.0.5",
    "mcp>=1.16.0",
    "pydantic>=2.11",
    "python-dotenv>=1.1.1",
    "pyyaml>=6.0.2",
    "uvicorn>=0.40.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trident"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
